name: Release Android APK

on:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - 'docs/install/**'
      - '.github/workflows/release-android.yml'
      - '.github/workflows/deploy-install-site.yml'

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Install dependencies
        working-directory: companion
        run: npm ci

      - name: Determine version bump
        id: bump
        run: node companion/scripts/bump-version.mjs --check

      - name: Bump version files
        if: steps.bump.outputs.should_release == 'true'
        run: node companion/scripts/bump-version.mjs

      - name: Commit version bump
        if: steps.bump.outputs.should_release == 'true'
        id: bump_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companion/src/versioning.cjs companion/package.json
          git commit -m "chore(release): companion-v${{ steps.bump.outputs.new_version }} [skip ci]"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require release secrets
        if: steps.bump.outputs.should_release == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          missing=()
          [ -z "$EXPO_TOKEN" ] && missing+=("EXPO_TOKEN")
          [ -z "$EAS_PROJECT_ID" ] && missing+=("EAS_PROJECT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            echo "Add them under Repo → Settings → Secrets and variables → Actions."
            echo "Create EXPO_TOKEN at https://expo.dev/settings/access-tokens"
            exit 1
          fi

      - uses: expo/expo-github-action@v8
        if: steps.bump.outputs.should_release == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo config
        if: steps.bump.outputs.should_release == 'true'
        working-directory: companion
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: npx expo config --json >/dev/null

      - name: Build Android APK
        if: steps.bump.outputs.should_release == 'true'
        id: build
        working-directory: companion
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          BUILD_JSON=$(eas build --platform android --profile production --non-interactive --wait --json)
          echo "$BUILD_JSON" > build-output.json
          BUILD_URL=$(node -e "const d=JSON.parse(require('fs').readFileSync('build-output.json','utf8')); const b=Array.isArray(d)?d[0]:d; console.log(b.artifacts?.buildUrl||b.artifacts?.applicationArchiveUrl||'');")
          if [ -z "$BUILD_URL" ]; then
            echo "::error::EAS build finished but no APK artifact URL was found"
            exit 1
          fi
          echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        if: steps.bump.outputs.should_release == 'true'
        run: |
          APK="ReachPanel-Companion-${{ steps.bump.outputs.new_version }}.apk"
          curl -fL --retry 3 -o "$APK" "${{ steps.build.outputs.build_url }}"
          if ! unzip -t "$APK" >/dev/null; then
            echo "::error::Downloaded artifact is not a valid APK (zip) archive"
            exit 1
          fi
          cp "$APK" ReachPanel-Companion.apk

      - name: Upload APK to Vercel Blob (public download)
        if: steps.bump.outputs.should_release == 'true'
        id: blob
        continue-on-error: true
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "::error::BLOB_READ_WRITE_TOKEN is required to publish a public APK"
            echo "Create a Blob store in the Vercel project and add the token as a GitHub Actions secret."
            exit 1
          fi
          STABLE_URL=$(node companion/scripts/upload-apk-to-blob.mjs ReachPanel-Companion.apk ReachPanel-Companion.apk)
          node companion/scripts/upload-apk-to-blob.mjs "ReachPanel-Companion-${{ steps.bump.outputs.new_version }}.apk" "ReachPanel-Companion-${{ steps.bump.outputs.new_version }}.apk" >/dev/null
          echo "apk_url=$STABLE_URL" >> "$GITHUB_OUTPUT"
          echo "Public APK URL (stable pathname): $STABLE_URL"
          echo "Optional: set GitHub Actions variable INSTALL_APK_PUBLIC_URL to this URL for manual Deploy install site runs."

      - name: Deploy install site with APK URL
        if: steps.bump.outputs.should_release == 'true' && steps.blob.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          APK_URL: ${{ steps.blob.outputs.apk_url }}
        run: |
          missing=()
          [ -z "$VERCEL_TOKEN" ] && missing+=("VERCEL_TOKEN")
          [ -z "$VERCEL_ORG_ID" ] && missing+=("VERCEL_ORG_ID")
          [ -z "$VERCEL_PROJECT_ID" ] && missing+=("VERCEL_PROJECT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing Vercel secrets for install site deploy: ${missing[*]}"
            exit 1
          fi
          sed -i "s|__INSTALL_APK_PUBLIC_URL__|${APK_URL}|g" docs/install/index.html
          npx vercel@latest deploy docs/install --prod --yes --token="$VERCEL_TOKEN"

      - name: Create GitHub pre-release
        if: steps.bump.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: companion-v${{ steps.bump.outputs.new_version }}
          name: ReachPanel Companion v${{ steps.bump.outputs.new_version }}
          target_commitish: ${{ steps.bump_commit.outputs.sha }}
          prerelease: true
          generate_release_notes: true
          files: |
            ReachPanel-Companion-${{ steps.bump.outputs.new_version }}.apk
            ReachPanel-Companion.apk
