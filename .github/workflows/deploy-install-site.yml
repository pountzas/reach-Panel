name: Deploy install site

# Dual-platform downloads page (Windows installers + Android APK).
# Page fetches public Blob downloads/latest.json itself; no CTA URL injection at deploy time.
# One-time setup: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets.

on:
  push:
    branches: [main]
    paths:
      - 'docs/install/**'
      - '.github/workflows/deploy-install-site.yml'
  workflow_dispatch:

concurrency:
  group: deploy-install-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=()
          [ -z "$VERCEL_TOKEN" ] && missing+=("secret:VERCEL_TOKEN")
          [ -z "$VERCEL_ORG_ID" ] && missing+=("secret:VERCEL_ORG_ID")
          [ -z "$VERCEL_PROJECT_ID" ] && missing+=("secret:VERCEL_PROJECT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            echo "Repo → Settings → Secrets and variables → Actions → Secrets"
            exit 1
          fi

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy docs/install --prod --yes --token="$VERCEL_TOKEN"
