name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

  validate-release-secrets:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify updater signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured in repository secrets."
            echo "Signed updater artifacts are required for releases. See CONTRIBUTING.md (Updater signing)."
            exit 1
          fi
          echo "Updater signing secret is present."

  build-windows:
    needs: [release-please, validate-release-secrets]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (signed release)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:tauri:release

      - name: Resolve Windows updater artifacts
        id: updater
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $sig = Get-ChildItem "$($installer.FullName).sig" | Select-Object -First 1
          if (-not $sig) { throw "NSIS signature not found" }
          "installer_name=$($installer.Name)" >> $env:GITHUB_OUTPUT
          "sig_name=$($sig.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload installers to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} `
            src-tauri/target/release/bundle/msi/*.msi `
            src-tauri/target/release/bundle/nsis/*.exe `
            src-tauri/target/release/bundle/nsis/*.exe.sig `
            --clobber

      - name: Upload Windows updater artifact
        uses: actions/upload-artifact@v7
        with:
          name: updater-windows
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig

  publish-updater-metadata:
    needs: [release-please, build-windows]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Push updater/latest.json back to main for the raw.githubusercontent.com endpoint.
          persist-credentials: true
          fetch-depth: 0

      - name: Download Windows updater artifact
        uses: actions/download-artifact@v8
        with:
          name: updater-windows
          path: artifacts/windows

      - name: Generate latest.json
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          WIN_EXE=$(find artifacts/windows -name '*-setup.exe' | head -n 1)
          WIN_SIG=$(find artifacts/windows -name '*-setup.exe.sig' | head -n 1)
          if [ -z "$WIN_EXE" ] || [ -z "$WIN_SIG" ]; then
            echo "Missing Windows updater artifacts"
            exit 1
          fi
          export WINDOWS_INSTALLER="$WIN_EXE"
          export WINDOWS_SIG="$WIN_SIG"
          node .github/scripts/generate-latest-json.mjs

      - name: Upload latest.json to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" latest.json --clobber

      # raw.githubusercontent.com is more reliable than /releases/latest/download for some networks.
      - name: Publish latest.json for raw.githubusercontent.com endpoint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p updater
          cp latest.json updater/latest.json
          git add updater/latest.json
          if git diff --cached --quiet; then
            echo "updater/latest.json unchanged"
            exit 0
          fi
          git commit -m "chore: sync updater/latest.json for ${{ needs.release-please.outputs.tag_name }}"
          git push origin main
