name: Build

on:
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (including tests)
        run: npm run typecheck

      - name: Lint (ESLint strict React/TS)
        run: npm run lint

      - name: Format (Prettier)
        run: npm run format:check

      - name: Unit tests (vitest)
        run: npm test

      - name: Run Blob and downloads-manifest tests
        run: npm run test:blob

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.96.0"

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Rust check + tests
        working-directory: src-tauri
        run: |
          cargo check --locked --all-targets
          cargo test --locked

  build-windows:
    # Only ship-validation builds: PRs from the integration branch into main.
    if: github.base_ref == 'main' && github.head_ref == 'dev'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.96.0"

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Prefetch Rust dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cargo fetch --manifest-path src-tauri/Cargo.toml; then
              exit 0
            fi
            echo "cargo fetch attempt ${attempt} failed; retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri app
        run: npm run build:tauri

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v7
        with:
          name: windows-bundle
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
