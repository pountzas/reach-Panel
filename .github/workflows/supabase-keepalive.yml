name: Supabase keep-alive

on:
  schedule:
    - cron: "17 4 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping diagnostics function
        env:
          REACH_SUPABASE_URL: ${{ secrets.REACH_SUPABASE_URL }}
          REACH_SUPABASE_ANON_KEY: ${{ secrets.REACH_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$REACH_SUPABASE_URL" ] || [ -z "$REACH_SUPABASE_ANON_KEY" ]; then
            echo "REACH_SUPABASE_URL or REACH_SUPABASE_ANON_KEY is unset; skipping ping."
            exit 0
          fi
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer ${REACH_SUPABASE_ANON_KEY}" \
            -H "apikey: ${REACH_SUPABASE_ANON_KEY}" \
            "${REACH_SUPABASE_URL%/}/functions/v1/submit-diagnostics"
