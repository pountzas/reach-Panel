version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels:
      - dependencies

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Transitive Linux/GTK stack pinned by Tauri; see SECURITY.md (GHSA-wrw7-89jp-8q8g).
      - dependency-name: glib
      - dependency-name: glib-sys
      - dependency-name: gtk
      - dependency-name: gtk-sys
      - dependency-name: gdk
      - dependency-name: gdk-sys
      - dependency-name: gio
      - dependency-name: gio-sys
      - dependency-name: cairo-rs
      - dependency-name: pango
      - dependency-name: webkit2gtk
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels:
      - dependencies
