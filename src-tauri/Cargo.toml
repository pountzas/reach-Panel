[package]
name = "reach-panel"
version = "0.18.0"
description = "ReachPanel — assistive virtual keyboard and mouse"
authors = ["Nik"]
edition = "2021"

[lib]
name = "reach_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12.5", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
anyhow = "1"
rfd = "0.17"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "sync", "macros", "io-util"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
local-ip-address = "0.6"
ureq = { version = "2", default-features = true, features = ["tls", "json"] }
lopdf = "0.45"
zip = { version = "9.3", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "0.62.2"
windows-future = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
windows = { version = "0.58", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Foundation",
    "Foundation_Collections",
    "Foundation_Metadata",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Globalization",
    "implement",
] }

# softbuffer 0.4.8 asserts when CreateDIBSection returns null (tauri#11525).
# tauri-runtime-wry 2.12.3 unwraps that resize, so the error still kills the process.
# tauri is pinned to ~2.12.5 above so this patch keeps applying; bump both together.
# Drop both patches once an upstream Tauri 2 line returns the error without unwrapping it.
[patch.crates-io]
softbuffer = { path = "vendor/softbuffer" }
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry" }
