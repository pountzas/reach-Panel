[package]
name = "reach-panel"
version = "0.9.0"
description = "ReachPanel — assistive virtual keyboard and mouse"
authors = ["Nik"]
edition = "2021"

[lib]
name = "reach_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.23"
anyhow = "1"
rfd = "0.17"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "sync", "macros", "io-util"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
local-ip-address = "0.6"
ureq = { version = "2", default-features = true, features = ["tls", "json"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
windows-future = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.58", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_Media_Speech",
    "Win32_Networking_WinInet",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Foundation",
    "Foundation_Collections",
    "Media_Core",
    "Media_Playback",
    "Media_SpeechSynthesis",
    "Media_SpeechRecognition",
    "Globalization",
    "Storage_Streams",
    "implement",
] }
